<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f5f1"><title>Douglas County | Inspector Toolkit</title>
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#103d32;--body:#27383b;--muted:#5c6a70;--line:#d9dedb;--green:#064b37;--shadow:0 7px 24px #20382c12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--body)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #5aa888;outline-offset:3px}
body.dark{--bg:#182823;--surface:#24362f;--ink:#e5f4eb;--body:#e3eae6;--muted:#b8c9c0;--line:#476057;--green:#2d8d65;--shadow:0 7px 25px #0003}
header{height:141px;background:#f9f9f6;position:relative;overflow:hidden;border-bottom:8px solid #86223d}

header:after{content:"";position:absolute;left:0;right:0;bottom:-0px;height:0;pointer-events:none}.mountains{position:absolute;right:0;bottom:0;height:135px;width:min(60%,900px);pointer-events:none;z-index:1}.mountains img{width:100%;height:100%;object-fit:contain;object-position:right bottom;display:block}
.brand{position:relative;z-index:2;padding:21px 4.3%;color:#063e32;width:58%}.brand h1{font-size:clamp(24px,3.1vw,51px);margin:0;letter-spacing:.01em;line-height:1.05}.brand p{margin:8px 0 0;font-size:clamp(11px,1.35vw,21px);letter-spacing:.24em}
.top-actions{position:absolute;right:2%;top:12px;z-index:5;display:flex;align-items:center;gap:10px}.top-actions button{border:1px solid #b9cbc3;background:#ffffffed;color:#064b37;border-radius:24px;padding:9px 13px;min-height:42px;white-space:nowrap;box-shadow:0 2px 8px #12382b15}
main{max-width:1450px;margin:auto;padding:40px 4% 28px}.intro{margin-bottom:25px}.eyebrow{font-size:19px;letter-spacing:.2em;color:var(--ink);margin:0 0 10px}.intro h2{font-size:clamp(32px,4.4vw,66px);color:var(--ink);line-height:1.02;margin:0 0 12px;font-weight:800}.intro p{font-size:clamp(17px,1.65vw,24px);line-height:1.4;margin:0}
.search{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:7px 9px 7px 23px;box-shadow:var(--shadow);gap:12px;margin:28px 0 20px}.search svg{flex:none;color:var(--ink)}.search input{min-width:0;flex:1;background:transparent;color:var(--body);border:0;outline:none;font-size:18px;padding:12px 0}.search button,.primary{background:#07503c;color:#fff;border:0;border-radius:21px;padding:16px 37px;font-weight:700;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:23px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:22px}
.tile{position:relative;display:flex;align-items:center;gap:24px;text-align:left;width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:31px 27px;min-height:177px;box-shadow:var(--shadow);overflow:hidden}.tile:after{content:none;display:none}.tile:hover{border-color:#5e9a83;transform:translateY(-1px)}.tile .ico{flex:0 0 110px;display:flex;align-items:center;justify-content:center;border-right:1px solid #6b8b7e;padding-right:20px}.tile .ico svg{width:75px;height:75px}.tile .copy{flex:1;z-index:1}.tile strong{display:block;font-size:clamp(18px,2vw,28px);line-height:1.15}.tile small{display:block;color:var(--muted);font-size:clamp(14px,1.4vw,19px);margin-top:10px;line-height:1.35;font-weight:500}.tile .arrow{font-size:33px;z-index:1}.grid3 .tile{min-height:118px;padding:20px 19px;gap:16px}.grid3 .tile .ico{flex-basis:78px;padding-right:15px}.grid3 .tile .ico svg{width:48px;height:48px}.grid3 .tile strong{font-size:20px}.grid3 .tile small{font-size:15px;margin-top:5px}
footer{display:flex;align-items:center;gap:20px;margin-top:35px;color:var(--muted);font-size:13px;letter-spacing:.15em}footer .rule{flex:1;border-top:1px solid var(--line)}.home{border:0;background:#064b37;color:white;border-radius:35px;padding:15px 25px;white-space:nowrap;letter-spacing:0;font-size:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin:18px 0}.panel h2{color:var(--ink);margin-top:0}.back{background:transparent;color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:9px}.item{border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:16px}.item summary{cursor:pointer;font-weight:700;color:var(--ink);font-size:18px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.actions button{background:var(--green);color:white;border:0;border-radius:8px;padding:10px 13px}.actions button.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.notice{font-size:14px;color:var(--muted);line-height:1.5}.hidden{display:none!important}.email-pick-row{display:flex;align-items:flex-start;gap:14px;padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}.email-pick-row input{width:23px;height:23px;accent-color:#07503c;flex:none}.email-pick-row span span{display:block;margin-top:8px;font-size:14px;color:var(--body)}.email-pick-row small{display:block;color:var(--muted);margin-top:4px}.inside li{margin:8px 0}
@media(max-width:800px){header{height:108px}.mountains{opacity:.7;width:70%;height:100px}.brand{padding:22px 4%;width:78%}.brand h1{font-size:27px}.brand p{font-size:10px;letter-spacing:.14em}.top-actions{top:8px;right:10px;gap:7px}.top-actions button{font-size:12px;padding:6px 9px;min-height:36px}main{padding:25px 4%}.grid2,.grid3{grid-template-columns:1fr}.tile{min-height:125px;padding:18px}.tile .ico{flex-basis:75px}.tile .ico svg{width:55px;height:55px}.intro h2{font-size:40px}.search button{padding:13px 18px}.search input{font-size:15px}.grid3{gap:12px;margin-top:12px}footer{flex-wrap:wrap}}
@media(max-width:440px){.mountains{opacity:.3}.brand h1{font-size:23px}.brand p{font-size:9px}.intro h2{font-size:34px}.eyebrow{font-size:13px}.search{padding-left:12px}.search button{font-size:14px;padding:12px}.tile .arrow{font-size:24px}}

.collection-dock{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 7px 25px #0003;border-radius:30px;padding:8px;max-width:calc(100% - 20px)}
.collection-dock button{border:0;background:#07503c;color:white;border-radius:24px;padding:12px 18px;font-weight:700;white-space:nowrap}.collection-dock button:last-child{background:#344d65}
body{padding-bottom:80px}.actions button.selected{background:#286d4d!important;color:#fff!important;border:2px solid #85c99b!important}.toast{position:fixed;z-index:50;top:155px;right:20px;background:#174d38;color:white;border-radius:12px;padding:15px 20px;box-shadow:0 8px 25px #0004;font-weight:bold;max-width:85vw}.collection-entry pre{white-space:pre-wrap;font-family:inherit;line-height:1.5}.collection-entry{border-bottom:1px solid var(--line);padding:15px 0}.collection-entry button{margin-top:6px}.actions button:disabled{opacity:.6;cursor:not-allowed}
@media(max-width:550px){.collection-dock{width:calc(100% - 20px)}.collection-dock button{flex:1;font-size:13px;padding:12px 7px}.toast{top:112px;right:10px}}
.county-maroon-bar{height:7px;background:#0b5943;width:100%;margin:0;padding:0;border:0;display:block}
/* Inspector-specific quick corrections */
.quick-tile{margin:0 0 20px;width:100%;display:flex;align-items:center;gap:16px;text-align:left;border:1px solid #9ebcae;border-left:7px solid #07503c;border-radius:13px;background:var(--surface);padding:18px 23px;color:var(--ink);box-shadow:var(--shadow)}
.quick-tile strong{font-size:22px}.quick-tile small{display:block;color:var(--muted);font-size:15px;margin-top:4px}.quick-tile .star{font-size:35px;color:#ad7e30}.quick-tile .end{margin-left:auto;font-size:26px}
.fav-button{border:1px solid #bdc8be!important;background:transparent!important;color:var(--ink)!important}.fav-button.saved{background:#e3f1e7!important;color:#15583e!important;border-color:#65a485!important}
.quick-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}.quick-controls select,.quick-controls input,.note-field{border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--body);padding:11px;min-width:0}.quick-controls input{flex:1;min-width:190px}.quick-controls select{max-width:100%}.quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.quick-actions button{padding:10px 14px;border:0;border-radius:8px;background:var(--green);color:white}.quick-actions button.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.note-field{width:100%;min-height:95px;resize:vertical;font:inherit;line-height:1.5}.quick-note{margin-top:12px}.quick-note label{display:block;font-weight:bold;margin-bottom:6px}.quick-note .notice{margin:5px 0}.quick-meta{font-size:13px;color:var(--muted)}.quick-check{width:22px;height:22px;accent-color:#07503c}.quick-row{display:flex;gap:12px;align-items:flex-start}.quick-row .quick-main{flex:1;min-width:0}.quick-toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.quick-toolbar button,.quick-toolbar label{border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}.quick-toolbar input[type=file]{display:none}
@media(max-width:600px){.quick-tile{padding:15px}.quick-tile strong{font-size:18px}.quick-controls{flex-direction:column;align-items:stretch}.quick-controls input{width:100%}}

/* Field-first correction preview: actions are visually bound to the text copied to POSSE. */
.inspection-highlight{background:#e9f3ec;border:1px solid #b7d5c1;border-left:6px solid #176548;border-radius:11px;padding:19px 20px 17px;margin:18px 0 24px;color:#173f32}
.inspection-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:15px;font-weight:800;letter-spacing:.065em;color:#12543c}
.inspection-cite{font-size:14px;letter-spacing:0;border:1px solid #b1d2bd;border-radius:8px;padding:5px 9px;background:#fff9}
.inspection-copy{font-size:17px;line-height:1.55;margin:15px 0 18px;white-space:pre-wrap}
.inspection-actions{display:flex;flex-wrap:wrap;gap:11px}
.inspection-actions button{min-height:46px;padding:11px 18px;font-weight:700;border-radius:9px;background:#09583f;color:#fff;border:1px solid #09583f}
.inspection-actions button.secondary{background:#fff;color:#09583f;border-color:#78aa90}
.inspection-actions button.selected{background:#d0ead8;color:#134b36}
body.dark .inspection-highlight{background:#1e4134;border-color:#467a60;border-left-color:#80d5a6;color:#e8f6ed}
body.dark .inspection-heading{color:#a6edc6}
body.dark .inspection-cite{background:#2c5843;border-color:#5b9975;color:#e8f6ed}
body.dark .inspection-actions button.secondary{background:#294d3d;color:#e6f5e9;border-color:#83b798}
body.dark .inspection-actions button.selected{background:#315f47;color:#e6f5e9}
@media(max-width:550px){.inspection-highlight{padding:15px}.inspection-actions button{flex:1 1 100%}}
</style><style>header{margin:0!important;border-bottom:8px solid #86223d!important}.county-maroon-bar{margin:0!important;border:0!important;padding:0!important;display:block!important;line-height:0!important}header + .county-maroon-bar{margin-top:0!important}
.library-bar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.library-bar input,.library-bar select{padding:13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--body);font-size:16px}.library-bar input{flex:1;min-width:180px}.library-bar select{min-width:175px}.reference{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:13px 0;overflow:hidden}.reference summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;padding:17px}.reference summary::-webkit-details-marker{display:none}.reference summary b{font-size:18px;color:var(--ink)}.reference summary .ref-title{flex:1}.reference summary small{color:var(--muted)}.reference .inside{padding:0 18px 19px;border-top:1px solid var(--line);line-height:1.55}.reference h3{color:var(--ink);font-size:16px;margin-bottom:5px}.reference p{margin-top:5px}.reference .source{font-size:13px;word-break:break-word}.reference .source a{color:var(--ink)}.reference .actions{margin-top:15px}.reference .actions button{padding:11px 13px}.reference .actions .secondary{background:var(--surface)}.warning{border-left:4px solid #b28737;padding:10px 13px;background:var(--surface);color:var(--muted);line-height:1.5;margin:15px 0}.collection-entry{border-bottom:1px solid var(--line);padding:14px 0}.collection-entry pre{white-space:pre-wrap;font:inherit;font-size:14px}.collection-count{display:inline-block;border-radius:30px;background:var(--green);color:white;padding:3px 9px;margin-left:6px;font-size:12px}
</style><style id="field-ui-stability">
html{scrollbar-gutter:stable;overflow-y:scroll}
#detailview{min-height:calc(100vh - 250px);width:100%}
#detail{width:100%;min-width:0;overflow-wrap:anywhere}
.library-bar{display:grid;grid-template-columns:minmax(230px,1fr) minmax(205px,245px) minmax(205px,245px);align-items:stretch}
.library-bar input,.library-bar select{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
#libResults{min-height:280px;width:100%}
.reference summary{min-width:0}.reference summary .ref-title{min-width:0;overflow-wrap:anywhere}
.collection-dock{box-sizing:border-box;gap:7px;border-radius:18px;align-items:center}
.collection-dock button{min-height:45px;padding:10px 15px}
.collection-dock #stickyHome{background:#e7eee9;color:#153e32;border:1px solid #a7beb1}
.mail-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:var(--ink);font-weight:700}
.email-fallback{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:15px;background:var(--surface)}
.email-fallback textarea{width:100%;min-height:230px;resize:vertical;margin-top:12px;padding:12px;background:var(--bg);color:var(--body);border:1px solid var(--line);border-radius:9px;font:14px/1.5 Arial,sans-serif}
@media(max-width:850px){.library-bar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.library-bar input{grid-column:1/-1}}
@media(max-width:550px){.library-bar{grid-template-columns:1fr}.library-bar input{grid-column:auto}.collection-dock{bottom:8px;width:calc(100% - 16px);padding:6px}.collection-dock button{font-size:12px;padding:9px 6px;min-width:0;flex:1}body{padding-bottom:110px}}
</style><style>
.source-detail{margin:16px 0;border:1px solid var(--line);border-radius:10px;padding:13px;background:var(--surface)}
.source-detail>summary{cursor:pointer;color:var(--ink);font-weight:700}
.source-body{line-height:1.65;white-space:normal;overflow-wrap:anywhere}
.source-body li{margin-bottom:9px}
.source-body p{margin:12px 0}
</style>

<script>
const DATA=[{"code":"2023","group":"Residential Electric Ready","cite":"RE301.1","title":"Scope","summary":"Applies residential electric-ready provisions to new buildings and to major renovations and additions, subject to the jurisdiction’s adopted scope.","correction":"RE301.1 — The plans do not establish whether the residential electric-ready provisions apply to this work. Identify the building and work type, determine whether the project falls within the adopted scope for new construction, additions, or major renovations, and show the applicable electric-ready compliance provisions or the basis for exclusion.","knowledge":"Confirm whether the project is new construction or a renovation/addition covered by the adopted requirements.","source":"https://mtcb.colorado.gov/sites/mtcb/files/documents/Model%20Colorado%20Electric%20and%20Solar%20Ready%20Code.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential Electric Ready","cite":"RE302.1","title":"Additional Electric Infrastructure","summary":"Residential combustion equipment is subject to the additional electric infrastructure provisions in RE302.2 through RE302.6. The model code excludes certain fireplaces and firepits.","correction":"RE302.1 — The plans or installation do not identify the additional electric infrastructure required for the covered combustion equipment. Identify each qualifying appliance and show the applicable future-electric circuit, pathway, termination, and labeling provisions under RE302.2 through RE302.6. Account for any equipment-specific exclusions before correcting.","knowledge":"Future conversion from combustion equipment to electric equipment may require dedicated circuit provisions, access and labeling. Verify which equipment is covered.","source":"https://mtcb.colorado.gov/sites/mtcb/files/documents/Model%20Colorado%20Electric%20and%20Solar%20Ready%20Code.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential Electric Ready","cite":"RE302.2","title":"Combustion Equipment","summary":"Covered combustion equipment must be supported by future electric infrastructure, including a dedicated appropriately sized branch circuit and an accessible receptacle or junction box meeting related requirements.","correction":"RE302.2 — The identified qualifying combustion appliance lacks complete infrastructure for a future electric replacement. Provide the dedicated branch circuit of the capacity required for the applicable equipment and an accessible receptacle or junction-box termination at the required location. Show the circuit and termination on the plans and verify related labeling and panel provisions.","knowledge":"Plan an electrical pathway and suitable circuit for later replacement of qualifying gas equipment with comparable electric equipment. A nearby box alone does not establish compliance.","source":"https://mtcb.colorado.gov/sites/mtcb/files/documents/Model%20Colorado%20Electric%20and%20Solar%20Ready%20Code.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential Solar Ready","cite":"RS402.1","title":"Solar-ready Applicability","summary":"Model-code solar-ready criteria address new residential buildings with qualifying roof area and orientation; the section contains exceptions including certain installed renewable systems and shading conditions.","correction":"RS402.1 — The project has not demonstrated whether the residential solar-ready requirements apply. Identify the qualifying roof area and orientation, evaluate shading and any installed renewable-energy system, and either provide the required solar-ready provisions or document a specific applicable exception.","knowledge":"Check the roof size, orientation, shade and any installed renewable system before assuming solar-ready construction is required.","source":"https://cms2.revize.com/revize/chaffeecounty/Documents/Departments/Building%20Department/Adopted%20Codes%20%26%20Design%20Criteria/77565.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential Solar Ready","cite":"RS402.2","title":"Construction Documents","summary":"Construction documents must identify the solar-ready zone.","correction":"RS402.2 — The approved plans do not clearly identify the designated solar-ready roof zone. Revise the construction documents to show the reserved zone's location and boundaries so the required roof area can be checked against setbacks, access pathways, and obstructions.","knowledge":"Show the reserved roof area on the plans so reviewers and inspectors can locate it.","source":"https://cms2.revize.com/revize/chaffeecounty/Documents/Departments/Building%20Department/Adopted%20Codes%20%26%20Design%20Criteria/77565.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential Solar Ready","cite":"RS402.3","title":"Solar-ready Zone Area","summary":"The model code generally establishes a minimum 300-square-foot solar-ready zone per dwelling unit, excluding required access and setbacks, with exceptions that must be evaluated.","correction":"RS402.3 — The designated solar-ready area has not been demonstrated on the plans. Show a qualifying reserved roof zone meeting the applicable minimum area (the source summary identifies a general 300-square-foot requirement per dwelling unit), excluding required access and setback areas; document any applicable exception or alternate condition.","knowledge":"A roof may have sufficient total area but still lack a compliant reserved solar-ready zone after setbacks and obstructions.","source":"https://cms2.revize.com/revize/chaffeecounty/Documents/Departments/Building%20Department/Adopted%20Codes%20%26%20Design%20Criteria/77565.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential EV Ready","cite":"RV502.1","title":"One- and Two-family Dwellings and Townhouses","summary":"Where a dwelling has a dedicated garage or other designated onsite parking, the model code calls for one EV-ready parking space per dwelling unit.","correction":"RV502.1 — The plans or installation do not identify the required EV-ready parking space for the dwelling with a dedicated garage or designated onsite parking. Identify the qualifying parking space and provide the corresponding EV-ready electrical infrastructure, or document why this provision does not apply.","knowledge":"Identify the EV-ready parking space on the plans and coordinate the circuit and receptacle location.","source":"https://cms2.revize.com/revize/chaffeecounty/Documents/Departments/Building%20Department/Adopted%20Codes%20%26%20Design%20Criteria/77565.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Residential EV Ready","cite":"RV502.2","title":"EV-ready Space Electrical Infrastructure","summary":"Model-code EV-ready spaces include a dedicated circuit with at least 8.3 kVA capacity (40 A at 208/240 V), receptacle positioning within 3 feet of the space, and identification of equipment for future EVSE; an installed hardwired EVSE may affect the receptacle requirement.","correction":"RV502.2 — The designated EV-ready parking space lacks one or more required electrical provisions. Provide a dedicated EV-ready circuit meeting the applicable capacity requirement (the source summary identifies at least 8.3 kVA), locate the receptacle within the specified distance of the parking space (the source summary identifies 3 feet), and identify the circuit and equipment. Where hardwired EVSE is installed, evaluate the applicable receptacle exception.","knowledge":"Provide the required EV-ready circuit and label the associated electrical equipment. Coordinate receptacle position with the parking layout and any installed EVSE.","source":"https://cms2.revize.com/revize/chaffeecounty/Documents/Departments/Building%20Department/Adopted%20Codes%20%26%20Design%20Criteria/77565.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Administration","cite":"104.2.1","title":"Solar Ready Inspection","summary":"Inspections address the designated solar-ready zone or installed renewable capacity, plus reserved service-panel electrical capacity and labeled breaker space as applicable.","correction":"104.2.1 — The required solar-ready inspection information or installation is incomplete. Identify and demonstrate the designated solar-ready zone or qualifying installed renewable system, and provide any applicable reserved panel capacity, identified breaker space, pathway, and labels needed to verify compliance.","knowledge":"At inspection, be prepared to show the solar-ready area, pathway and any required panel provisions.","source":"https://mtcb.colorado.gov/sites/mtcb/files/documents/Model%20Colorado%20Electric%20and%20Solar%20Ready%20Code.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Administration","cite":"104.2.2","title":"EV Ready Inspection","summary":"Inspections verify EV infrastructure, installed circuits/raceways/boxes/receptacles or EVSE, required labels and applicable reserved panel capacity.","correction":"104.2.2 — The EV-ready installation cannot be verified from the observed work or approved plans. Identify the designated EV parking space and demonstrate the required branch circuit or raceway, outlet/termination or installed EVSE, circuit labels, and applicable reserved panel capacity. Correct missing components under the substantive EV-ready section.","knowledge":"Have the EV parking-space designation, circuit identification and installed electrical equipment available for inspection.","source":"https://mtcb.colorado.gov/sites/mtcb/files/documents/Model%20Colorado%20Electric%20and%20Solar%20Ready%20Code.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2023","group":"Administration","cite":"104.2.3","title":"Electric Ready Inspection","summary":"Inspections verify electric-ready circuits, raceways, wiring and terminations required by the code and approved documents.","correction":"104.2.3 — The electric-ready provisions for the identified future electric equipment are incomplete or concealed without sufficient documentation. Provide or document the required branch circuit, conductor/raceway pathway, accessible termination, and identification as applicable to the equipment and approved plans.","knowledge":"Inspectors may need to verify the circuit, wiring pathway, termination and equipment provisions before concealment.","source":"https://mtcb.colorado.gov/sites/mtcb/files/documents/Model%20Colorado%20Electric%20and%20Solar%20Ready%20Code.pdf","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2024","group":"Commercial Solar Ready","cite":"C410.4.2.2","title":"Solar-ready Zone Area","summary":"The Colorado commercial solar-ready zone is generally at least 40% of adjusted roof area, with specified minimum subzone dimensions and alternative permitted locations. Verify full section and exceptions.","correction":"C410.4.2.2 — The commercial solar-ready zone calculation or layout is incomplete. Show the adjusted roof-area calculation and a reserved solar-ready zone meeting the applicable percentage (the source summary identifies a general 40% requirement). Dimension the qualifying subzones and account for roof exclusions, access areas, permitted alternative locations, and exceptions.","knowledge":"Identify roof exclusions, calculate the required zone area and show qualifying subzones with dimensions on the plans.","source":"https://codes.iccsafe.org/s/COMLEACC2024P1/chapter-4-ce-commercial-energy-efficiency/COMLEACC2024P1-CE-Ch04-SecC410.4.2.2","status":"Detailed original-language draft — NOT VERIFIED against applicable adopted Colorado text and Douglas County amendments; confirm thresholds, exceptions, and applicability before enforcement."},{"code":"2024","group":"Residential Electrical Energy Controls","cite":"R403.6.5","title":"Intermittent bathroom and toilet exhaust fan controls","summary":"Where intermittent exhaust is used in bathrooms or toilet rooms, the  source lists timer, occupancy, humidity, or contaminant-based automatic fan shutoff controls, with specified settings and conditions.","correction":"R403.6.5 — Bathroom Exhaust Fan Controls: Provide automatic shutoff controls for intermittently operated bathroom/toilet room exhaust fans using a timer, occupancy sensor, humidity sensor, or contaminant sensor. Timer and occupancy controls must include a setting of 30 minutes or less. A manual switch alone does not satisfy this requirement. Confirm whether the whole-house ventilation exception applies.","knowledge":"An ordinary manual switch alone may not meet the intermittent exhaust control provisions. Confirm the control type, settings, and automatic fan shutoff operation.","source":"","status":"Imported verbatim source text from user-supplied prior reference; detailed correction independently paraphrased from that text. Confirm September 2025 Colorado amendments and Douglas County adoption before enforcement.","codeDetail":"<p>Where an exhaust system serving a bathroom or toilet room is designed for intermittent operation, the exhaust system controls shall include one or more of the following:</p><ol><li>A timer control with one or more delay setpoints that automatically turns off exhaust fans when the selected setpoint is reached. Not fewer than one delay-off setpoint shall be 30 minutes or less.</li><li>An occupant sensor control with one or more delay setpoints that automatically turns off exhaust fans in accordance with the selected delay setpoint after all occupants have vacated the space. Not fewer than one delay-off setpoint shall be 30 minutes or less.</li><li>A humidity control with an adjustable setpoint ranging between 50 percent or more and 80 percent or less relative humidity that automatically turns off exhaust fans when the selected setpoint is reached.</li><li>A contaminant control that responds to a particle or gaseous concentration and automatically turns off exhaust fans when a design setpoint is reached.</li></ol><p><em>Manual off functionality shall not be used in lieu of the minimum setpoint functionality required by this section.</em></p><p><strong>Exception:</strong> Bathroom and toilet room exhaust systems serving as an integral component of an outdoor air ventilation system or a whole-house mechanical ventilation system.</p>"},{"code":"2024","group":"Residential Electrical Energy Controls","cite":"R404.2.1","title":"Lighting controls in habitable spaces","summary":" describes a manual dimmer or qualifying automatic shutoff control for permanently installed luminaires in habitable spaces; automatic controls also allow manual on/off operation.","correction":"R404.2.1 — Habitable Space Lighting Controls: Provide either a manual dimmer or an automatic shutoff control for permanently installed lighting in habitable spaces. Where automatic shutoff is used, the lighting must turn off within 20 minutes after the room becomes unoccupied, and occupants must be able to turn the lights on and off manually.","knowledge":"Habitable-space lighting needs the applicable dimming or automatic-off functionality. Demonstrate operation of the installed controls.","source":"","status":"Imported verbatim source text from user-supplied prior reference; detailed correction independently paraphrased from that text. Confirm September 2025 Colorado amendments and Douglas County adoption before enforcement.","codeDetail":"<p>All permanently installed luminaires in habitable spaces shall be controlled with a <em>manual dimmer</em> or with an <em>automatic shutoff</em> control that automatically turns off lights within 20 minutes after all occupants have left the space and shall incorporate a <em>manual</em> control to allow occupants to turn the lights on or off.</p>"},{"code":"2024","group":"Residential Electrical Energy Controls","cite":"R404.2.2","title":"Lighting controls in specified rooms","summary":" identifies garages, unfinished basements, laundry rooms, and utility rooms as locations requiring automatic shutoff controls for permanently installed luminaires, together with manual control.","correction":"R404.2.2 — Lighting Controls in Specified Rooms: Provide automatic shutoff controls for permanently installed lighting in garages, unfinished basements, laundry rooms, and utility rooms. Lighting must turn off within 20 minutes after occupants leave the space, with manual on/off control also provided.","knowledge":"Check the automatic-off function and manual operation of permanent lighting in the listed spaces.","source":"","status":"Imported verbatim source text from user-supplied prior reference; detailed correction independently paraphrased from that text. Confirm September 2025 Colorado amendments and Douglas County adoption before enforcement.","codeDetail":"<p>All permanently installed luminaires in garages, unfinished basements, laundry rooms and utility rooms shall be controlled by an <em>automatic shutoff</em> control that automatically turns off lights within 20 minutes after all occupants have left the space and shall incorporate a <em>manual</em> control to allow occupants to turn the lights on or off.</p>"},{"code":"2024","group":"Residential Electrical Energy Controls","cite":"R404.3","title":"Exterior lighting controls — general","summary":" points from the general exterior-lighting-controls provision to the specific dwelling-unit control requirements in R404.3.1.","correction":"R404.3 — Exterior Lighting Controls: Evaluate permanently installed dwelling-unit exterior lighting under R404.3.1. Confirm the combined fixture wattage and whether the required manual control, daylight-responsive shutoff, and automatic-override reset functions are provided where applicable.","knowledge":"Use this section as a navigation reference; check the applicable dwelling-unit controls and thresholds before selecting a correction.","source":"","status":"Imported verbatim source text from user-supplied prior reference; detailed correction independently paraphrased from that text. Confirm September 2025 Colorado amendments and Douglas County adoption before enforcement.","codeDetail":"<p>Exterior lighting controls shall comply with Section R404.3.1.</p>"},{"code":"2024","group":"Residential Electrical Energy Controls","cite":"R404.3.1","title":"Exterior lighting controls for individual dwelling units","summary":"For qualifying permanently installed exterior lighting above the source's 30-watt threshold,  describes manual switching, automatic daylight shutoff, and limitations on manual overrides.","correction":"R404.3.1 — Dwelling-Unit Exterior Lighting Controls: Where permanently installed exterior lighting exceeds 30 watts total, provide manual on/off control and automatic daylight shutoff. Any manual override must return to automatic operation within 24 hours. Demonstrate control operation at final inspection.","knowledge":"Confirm whether the installed exterior lighting meets the section's applicability threshold and demonstrate automatic daylight shutoff and the required return from overrides.","source":"","status":"Imported verbatim source text from user-supplied prior reference; detailed correction independently paraphrased from that text. Confirm September 2025 Colorado amendments and Douglas County adoption before enforcement.","codeDetail":"<p>Where the total permanently installed exterior lighting power is greater than 30 watts, the permanently installed exterior lighting shall comply with the following:</p><ol><li>Lighting shall be controlled by a <em>manual</em> on and off switch which permits <em>automatic</em> shut-off actions.</li><li>Lighting shall be automatically shut off when daylight is present and satisfies the lighting needs.</li><li>Controls that override <em>automatic</em> shut-off actions shall not be allowed unless the override automatically returns <em>automatic</em> control to its normal operation within 24 hours.</li></ol>"}];
const HVAC_CORRECTION={code:'NEC',group:'Electrical — HVAC',cite:'210.8(F)',title:'Outdoor HVAC GFCI Protection',correction:'NEC 210.8(F) — Outdoor HVAC GFCI Protection: Provide GFCI protection for outdoor HVAC equipment outlets at dwelling units supplied by single-phase branch circuits rated 150 volts or less to ground and 50 amperes or less. The temporary exception for qualifying listed HVAC equipment expired September 1, 2026. GFCI protection is required for equipment subject to this section.',knowledge:'Verify the adopted NEC edition, applicability, and any local amendments before issuing this correction.',status:'Verify the applicable adopted NEC edition and local amendments before enforcement.'};
const HVAC_ID=DATA.push(HVAC_CORRECTION)-1;
const home=document.getElementById('homeview'),detailView=document.getElementById('detailview'),detail=document.getElementById('detail');
const $=id=>document.getElementById(id);let current='home',collection=[],posseCollection=[];let toastTimer;function notify(message){const el=$('toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}function refreshCounts(){$('posseCount').textContent=posseCollection.length;$('emailCount').textContent=collection.length}
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showShell(title){current=title;home.classList.add('hidden');detailView.classList.remove('hidden');window.scrollTo(0,0)}
function goHome(){current='home';detailView.classList.add('hidden');home.classList.remove('hidden');window.scrollTo(0,0)}
function library(code,query=''){
 showShell('library');const title=code==='2023'?'Colorado Model Electric Ready and Solar Ready Code (2023)':'2024 Colorado Model Low Energy and Carbon Code';
 detail.innerHTML=`<h2>${title}</h2><p class="notice">Separate electrical-only reference library for this publication; the 2023 and 2024 codes are not merged. Five residential control references were imported from . All imported text is paraphrased and requires comparison with the September 2025 Colorado revision before enforcement. Check local adoption, exceptions and permit applicability before issuing corrections.</p><div class="library-bar"><input id="libQuery" aria-label="Filter code sections" placeholder="Search section, keyword or topic" value="${escapeHTML(query)}"><select id="codeFilter" aria-label="Code edition"><option value="2023" ${code==='2023'?'selected':''}>2023 Electric / Solar Ready</option><option value="2024" ${code==='2024'?'selected':''}>2024 Low Energy / Carbon</option><option value="all">Both publications</option></select><select id="groupFilter" aria-label="Filter topic"><option value="all">All electrical topics</option></select></div><div id="libCount" class="notice"></div><div id="libResults"></div>`;
 const groups=[...new Set(DATA.map(x=>x.group))];$('groupFilter').innerHTML+=[...groups].map(g=>`<option value="${escapeHTML(g)}">${escapeHTML(g)}</option>`).join('');
 $('libQuery').addEventListener('input',renderResults);$('codeFilter').addEventListener('change',renderResults);$('groupFilter').addEventListener('change',renderResults);renderResults();
}
function renderResults(){let q=$('libQuery').value.trim().toLowerCase(),c=$('codeFilter').value,g=$('groupFilter').value;let results=DATA.filter(x=>(c==='all'||x.code===c)&&(g==='all'||x.group===g)&&(!q||[x.cite,x.title,x.group,x.summary,x.correction,x.knowledge].join(' ').toLowerCase().includes(q)));
 $('libCount').textContent=`${results.length} reference${results.length===1?'':'s'} · Draft summaries; verify before enforcement`;
 $('libResults').innerHTML=results.length?results.map(x=>{let id=DATA.indexOf(x),inPosse=posseCollection.includes(id),inEmail=collection.includes(id);return `<details class="reference"><summary><b>${escapeHTML(x.cite)}</b><span class="ref-title">${escapeHTML(x.title)}</span><small>${escapeHTML(x.code)}</small><span aria-hidden="true">⌄</span></summary><div class="inside"><p class="notice">${escapeHTML(x.group)} · ${escapeHTML(x.status||'Review required')}</p><section class="inspection-highlight" aria-label="Inspection correction"><div class="inspection-heading"><span>INSPECTION CORRECTION</span><span class="inspection-cite">${escapeHTML(x.cite)}</span></div><p class="inspection-copy">${escapeHTML(x.correction)}</p><div class="inspection-actions"><button data-action="correction" data-id="${id}">Copy Correction</button><button class="secondary ${inPosse?'selected':''}" data-action="posse" data-id="${id}">${inPosse?'✓ Added to POSSE':'+ Add to POSSE'}</button></div></section><h3>Code Requirements</h3>${x.codeDetail?`<div class="source-body">${x.codeDetail}</div>`:`<p>${escapeHTML(x.summary)}</p><p class="notice">Full section text not yet available in this toolkit. Confirm the adopted code before enforcement.</p>`}<h3>Contractor Knowledge</h3><p>${escapeHTML(x.knowledge)}</p><div class="actions"><button class="fav-button ${favorites[id]?'saved':''}" data-action="favorite" data-id="${id}">${favorites[id]?'★ Saved to Quick':'☆ Save to Quick'}</button><button data-action="knowledge" data-id="${id}">Copy Contractor Knowledge</button><button class="secondary ${inEmail?'selected':''}" data-action="emailadd" data-id="${id}">${inEmail?'✓ Added to Email':'+ Add to Email'}</button></div><p class="source"><a href="${escapeHTML(x.source)}" target="_blank" rel="noopener noreferrer">View source ↗</a></p></div></details>`}).join(''):'<p>No matching electrical references in this initial library.</p>';
}
async function copyText(value,button){let ok=false;try{await navigator.clipboard.writeText(value);ok=true}catch(e){try{const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e){}}if(ok){notify('✓ Copied to clipboard');if(button){let old=button.textContent;button.textContent='✓ Copied!';setTimeout(()=>{if(button.isConnected)button.textContent=old},1700)}}else notify('Clipboard blocked — please use a secure browser or select and copy the preview text.')}
function formatted(x,field){return `${x.code==='NEC'?'National Electrical Code':x.code==='2023'?'2023 Colorado Model Electric Ready and Solar Ready Code':'2024 Colorado Model Low Energy and Carbon Code'} — ${x.cite} ${x.title}\n${field==='correction'?x.correction:x.knowledge}`}
function compiled(ids,field){return ids.map(i=>field==='correction'&&favorites[i]?.note?quickFormatted(i):formatted(DATA[i],field)).join('\n\n--------------------\n\n')}
detail.addEventListener('click',e=>{const f=e.target.closest('[data-action="favorite"]');if(!f)return;let id=Number(f.dataset.id);if(favorites[id]){delete favorites[id];notify('Removed from Quick Corrections')}else{favorites[id]={category:DATA[id].group,note:''};notify('★ Saved to Quick Corrections')}saveFavorites();f.textContent=favorites[id]?'★ Saved to Quick':'☆ Save to Quick';f.classList.toggle('saved',!!favorites[id]);});
detail.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.dataset.action==='favorite')return;let id=Number(b.dataset.id),x=DATA[id],a=b.dataset.action;if(a==='posse'||a==='emailadd'){let arr=a==='posse'?posseCollection:collection,label=a==='posse'?'POSSE':'Email';if(arr.includes(id)){notify('✓ Already in '+label+' Collection');return}arr.push(id);b.textContent='✓ Added to '+label;b.classList.add('selected');refreshCounts();notify('✓ '+x.cite+' added to '+label+' Collection');return}copyText(formatted(x,a==='correction'?'correction':'knowledge'),b)});
function renderCollection(kind){const isPosse=kind==='posse',ids=isPosse?posseCollection:collection,label=isPosse?'POSSE':'Email',field=isPosse?'correction':'knowledge';showShell(kind);detail.innerHTML=`<h2>${label} Collection (${ids.length})</h2>${!isPosse?'<button class="back" id="addMoreEmail">+ Select More Code Sections</button>':''}<p class="notice">Draft code summaries — verify citations, exceptions and local adoption before issuing corrections. Entries remain selected while navigating this page, but are not stored after closing or reloading it.</p><div id="colEntries">${ids.length?ids.map((id,i)=>`<div class="collection-entry"><b>${escapeHTML(DATA[id].cite)} — ${escapeHTML(DATA[id].title)}</b><pre>${escapeHTML(field==='correction'&&favorites[id]?.note?quickFormatted(id):formatted(DATA[id],field))}</pre><button class="back" data-remove="${i}">Remove</button></div>`).join(''):'No entries selected. Browse either code library and add references.'}</div><div class="actions"><button id="copyAll" ${ids.length?'':'disabled'}>Copy All to ${label==='POSSE'?'POSSE':'Clipboard'}</button>${isPosse?'':`<button id="emailDraft" ${ids.length?'':'disabled'}>Open Email Draft</button>`}<button class="secondary" id="clearAll" ${ids.length?'':'disabled'}>Clear Collection</button></div>`;
 if(!isPosse)$('addMoreEmail').onclick=emailPicker; $('colEntries').onclick=e=>{let b=e.target.closest('[data-remove]');if(b){ids.splice(Number(b.dataset.remove),1);refreshCounts();notify('Removed from '+label+' Collection');renderCollection(kind)}};
 $('copyAll').onclick=e=>copyText(compiled(ids,field),e.target);
 if(!isPosse)$('emailDraft').onclick=async()=>{
   const body='Hello,\n\nPlease review the following energy code information for your project:\n\n'+compiled(ids,'knowledge')+'\n\nThank you.';
   const subject='Energy Code Information';
   const mailto='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
   // A long mailto URL can fail silently in Chrome or exceed email-client limits.
   // Always provide a copyable fallback; the user can paste it into Outlook or webmail.
   let fallback=$('emailFallback');
   if(!fallback){fallback=document.createElement('div');fallback.id='emailFallback';fallback.className='email-fallback';$('emailDraft').closest('.actions').after(fallback)}
   fallback.innerHTML='<p><strong>Email draft ready.</strong> If your email program does not open, copy the draft below and paste it into Outlook or your email application.</p><div class="actions"><button type="button" id="copyDraft">Copy Complete Email Draft</button><a id="openMailClient" class="mail-link" href="'+escapeHTML(mailto)+'">Try Opening Email Application</a></div><textarea id="emailPreview" aria-label="Email draft preview" readonly></textarea>';
   $('emailPreview').value='Subject: '+subject+'\n\n'+body;
   $('copyDraft').onclick=e=>copyText($('emailPreview').value,e.currentTarget);
   if(mailto.length>1800){notify('Email is too long for reliable direct opening — use Copy Complete Email Draft.')}else{
     // A real anchor click is more compatible with browser protocol handlers.
     $('openMailClient').click();notify('Email launch requested. If nothing opens, copy the draft below.');
   }
 };
 $('clearAll').onclick=()=>{ids.length=0;refreshCounts();notify(label+' Collection cleared');renderCollection(kind)};
}
const GLOSSARY=[
['AHJ','Authority Having Jurisdiction','The organization or official responsible for interpreting and enforcing the adopted requirements.'],
['Electric Ready','Future electric equipment preparation','Infrastructure planned for future replacement of qualifying fuel-burning equipment with electric equipment; the exact requirements depend on the applicable adopted section.'],
['Solar Ready','Future photovoltaic installation preparation','Roof area, pathways and related provisions reserved or planned to accommodate future solar equipment, where required.'],
['EV Ready','Electric vehicle charging readiness','A parking space provided with electrical infrastructure for EV charging as specified by the applicable code. Do not assume EV Ready and EV Capable mean the same thing.'],
['EV Capable','Future EV charging provision','A designated parking space with provisions for future charging infrastructure; the required level of completion depends on the governing section.'],
['EVSE','Electric Vehicle Supply Equipment','Equipment that supplies electrical energy to charge an electric vehicle.'],
['PV','Photovoltaic','Equipment that converts sunlight into electrical energy.'],
['Branch Circuit','Electrical distribution term','Conductors between the final overcurrent device protecting the circuit and its outlet(s).'],
['Dedicated Circuit','Circuit reserved for a specific purpose','A branch circuit intended to serve the designated equipment or future equipment. Verify the governing requirement before specifying capacity.'],
['Raceway','Wiring pathway','An enclosed channel intended for holding conductors or cables, as permitted by applicable electrical rules.'],
['Solar-ready Zone','Designated future solar area','A designated area suitable for a future solar installation, subject to the governing area, access and obstruction rules.'],
['OCPD','Overcurrent Protective Device','A device intended to protect a circuit against excessive current, such as a circuit breaker or fuse.'],
['kVA','Kilovolt-amperes','A unit of apparent electrical power used for electrical capacity and load calculations.'],
['IECC','International Energy Conservation Code','The model energy code used as a basis for state and locally adopted energy requirements.'],
['POSSE','Inspection record workflow','The inspection-system destination for copied correction text in this toolkit.']];
function definitions(){showShell('definitions');detail.innerHTML=`<h2>Code Definitions & Field Glossary</h2><p class="notice">Quick-reference explanations written for inspectors. These are <b>not verbatim legal definitions</b>; consult the adopted code's definitions chapter where the precise defined term controls.</p><div class="library-bar"><input id="glossarySearch" placeholder="Find a term or abbreviation" aria-label="Search glossary"></div><div id="glossaryResults"></div>`;const render=()=>{const q=$('glossarySearch').value.toLowerCase().trim();$('glossaryResults').innerHTML=GLOSSARY.filter(x=>x.join(' ').toLowerCase().includes(q)).map(x=>`<details class="reference"><summary><b>${escapeHTML(x[0])}</b><span class="ref-title">${escapeHTML(x[1])}</span><span aria-hidden="true">⌄</span></summary><div class="inside"><p>${escapeHTML(x[2])}</p><div class="actions"><button data-glossary="${escapeHTML(x[0])}">Copy Explanation</button></div></div></details>`).join('')||'<p>No matching glossary terms.</p>'};$('glossarySearch').oninput=render;render();$('glossaryResults').onclick=e=>{let b=e.target.closest('[data-glossary]');if(!b)return;let x=GLOSSARY.find(x=>x[0]===b.dataset.glossary);if(x)copyText(`${x[0]} — ${x[1]}\n${x[2]}`,b)}}
const CHECKLISTS=[{name:'Residential electric-ready inspection',points:['Confirm the correct code edition and permit applicability.','Compare the approved equipment schedule with required future-electric provisions.','Check circuit, raceway, termination and panel identification against the applicable section.','Document any exception before writing a correction.']},{name:'Residential solar-ready inspection',points:['Confirm whether the project is subject to solar-ready requirements.','Locate the solar-ready zone on approved plans.','Check the designated zone, obstructions and pathways against the applicable section.','Review required panel provisions and labels.']},{name:'EV infrastructure inspection',points:['Confirm parking-space count and classification on the approved plans.','Verify installed electrical infrastructure and location.','Check identification, panel provisions and any installed EVSE.','Record the governing section and applicable exception.']},{name:'Commercial electrical energy inspection',points:['Identify the adopted commercial energy-code requirements.','Review lighting control schedules and approved plans.','Verify installed lighting controls and associated documentation.','Check any applicable solar-ready or EV infrastructure provisions.']}];
function topics(){showShell('topics');detail.innerHTML=`<h2>Inspection Topics</h2><p class="notice">Practical inspection checklists for navigating the field. These are <b>not enforceable code requirements</b> and do not replace the applicable sections.</p>`+CHECKLISTS.map((x,i)=>`<details class="reference"><summary><b>${escapeHTML(x.name)}</b><span aria-hidden="true">⌄</span></summary><div class="inside"><ul>${x.points.map(p=>`<li>${escapeHTML(p)}</li>`).join('')}</ul><div class="actions"><button data-topic="${i}">Copy Checklist</button><button class="secondary" data-open-library="${i===3?'2024':'2023'}">Browse Code Sections</button></div></div></details>`).join('');detail.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{let x=CHECKLISTS[Number(b.dataset.topic)];copyText(x.name+'\n'+x.points.map((p,i)=>`${i+1}. ${p}`).join('\n'),b)});detail.querySelectorAll('[data-open-library]').forEach(b=>b.onclick=()=>library(b.dataset.openLibrary))}
function emailPicker(){showShell('email-picker');let filtered=DATA;detail.innerHTML=`<h2>Build Email Collection</h2><p class="notice">Select from all ${DATA.length} draft code-reference entries across both publications. Email uses <b>Contractor Knowledge</b>, not inspector correction wording. Confirm applicability and citations before sending.</p><div class="library-bar"><input id="emailSearch" placeholder="Search sections or topics" aria-label="Search email references"><select id="emailEdition"><option value="all">Both code publications</option><option value="2023">2023 Model Code</option><option value="2024">2024 Low Energy / Carbon</option></select></div><div id="emailPickerList"></div><div class="actions"><button id="reviewEmail">Review Email Collection (<span id="pickerCount">${collection.length}</span>)</button><button class="secondary" id="selectVisible">Select All Visible</button><button class="secondary" id="clearEmailSelections">Clear Selections</button></div>`;let render=()=>{let q=$('emailSearch').value.toLowerCase().trim(),ed=$('emailEdition').value;filtered=DATA.filter(x=>(ed==='all'||x.code===ed)&&(!q||[x.cite,x.title,x.group,x.knowledge].join(' ').toLowerCase().includes(q)));$('emailPickerList').innerHTML=filtered.map(x=>{let id=DATA.indexOf(x);return `<label class="email-pick-row"><input type="checkbox" data-pick="${id}" ${collection.includes(id)?'checked':''}><span><strong>${escapeHTML(x.cite)} — ${escapeHTML(x.title)}</strong><small>${escapeHTML(x.code)} · ${escapeHTML(x.group)}</small><span>${escapeHTML(x.knowledge)}</span></span></label>`}).join('')||'<p>No matching code sections.</p>';$('pickerCount').textContent=collection.length};$('emailSearch').oninput=render;$('emailEdition').onchange=render;$('emailPickerList').onchange=e=>{let cb=e.target.closest('[data-pick]');if(!cb)return;let id=Number(cb.dataset.pick);if(cb.checked&&!collection.includes(id))collection.push(id);if(!cb.checked)collection=collection.filter(x=>x!==id);refreshCounts();$('pickerCount').textContent=collection.length;notify(cb.checked?'✓ Added to Email Collection':'Removed from Email Collection')};$('reviewEmail').onclick=()=>renderCollection('email');$('selectVisible').onclick=()=>{filtered.forEach(x=>{let id=DATA.indexOf(x);if(!collection.includes(id))collection.push(id)});refreshCounts();render();notify('✓ Visible sections selected')};$('clearEmailSelections').onclick=()=>{collection=[];refreshCounts();render();notify('Email selections cleared')};render()}


// Favorites and personal notes are stored only on this browser/device. The master code data is immutable.
const FAVORITES_KEY='dcInspectorQuickCorrectionsV1';
let favorites={};
try{let raw=JSON.parse(localStorage.getItem(FAVORITES_KEY)||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw)){Object.entries(raw).forEach(([k,v])=>{let i=Number(k);if(Number.isInteger(i)&&i>=0&&i<DATA.length&&v&&typeof v==='object')favorites[i]={category:String(v.category||DATA[i].group).slice(0,80),note:String(v.note||'').slice(0,3000)}})}}catch(e){}
function saveFavorites(){try{localStorage.setItem(FAVORITES_KEY,JSON.stringify(favorites))}catch(e){notify('Local saving unavailable. Export a backup.')}updateFavCount()}
function updateFavCount(){let el=$('favoriteHomeCount');if(el)el.textContent=Object.keys(favorites).length}
function quickFormatted(id){let text=formatted(DATA[id],'correction');let note=(favorites[id]?.note||'').trim();return text+(note?'\n\nInspector additional notes (personal):\n'+note:'')}
function quickExport(){let entries=Object.entries(favorites).map(([id,v])=>({code:DATA[id].code,cite:DATA[id].cite,title:DATA[id].title,category:v.category,note:v.note}));let blob=new Blob([JSON.stringify({format:'dc-inspector-quick-v1',entries},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='inspector-quick-corrections-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Backup exported')}
async function quickImport(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='dc-inspector-quick-v1'||!Array.isArray(obj.entries))throw Error('Wrong backup format');let count=0;for(let item of obj.entries){let i=DATA.findIndex(x=>x.code===item.code&&x.cite===item.cite&&x.title===item.title);if(i<0)continue;favorites[i]={category:String(item.category||DATA[i].group).slice(0,80),note:String(item.note||'').slice(0,3000)};count++}saveFavorites();quickCorrections();notify(count+' favorites imported; unmatched entries skipped')}catch(e){notify('Could not import backup: '+e.message)}}
function quickCorrections(){showShell('quick');let all=Object.keys(favorites).map(Number).filter(i=>DATA[i]);let cats=[...new Set(all.map(i=>favorites[i].category))].sort();detail.innerHTML=`<h2>★ My Quick Corrections (${all.length})</h2><p class="notice">Save frequently used code sections with ☆ Save to Quick inside either library. The code citation and correction are locked; only your personal notes and category can be edited. Notes are included when copying from Quick Corrections.</p><div class="item" style="border-left:5px solid var(--green)"><strong>⚡ Outdoor HVAC GFCI — NEC 210.8(F)</strong><p class="notice">Permanent Inspection Writer shortcut · Verify adopted NEC edition and local amendments before enforcement.</p><div class="quick-actions"><button id="hvacCopy">Copy Correction</button><button id="hvacPosse">Add to POSSE</button></div></div><div class="quick-controls"><input id="quickSearch" placeholder="Search my saved corrections" aria-label="Search favorites"><select id="quickCategory"><option value="all">All my categories</option>${cats.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join('')}</select><button id="newCategory" class="back">+ New category</button></div><div id="quickList"></div><div class="quick-toolbar"><button id="quickCopySelected">Copy selected to POSSE</button><button id="quickAddSelected">Add selected to POSSE Collection</button><button id="quickAddEmailSelected">Add selected to Email Collection</button><button id="quickExport">↓ Export favorites</button><label for="quickImport">↑ Import favorites<input id="quickImport" type="file" accept="application/json,.json"></label></div><p class="notice">Favorites and notes remain in this browser's local storage, not in a county account. Export a backup before switching devices or clearing browser data. Draft code text still requires source verification before enforcement.</p>`;
 let selected=new Set();function draw(){let q=$('quickSearch').value.trim().toLowerCase(),cat=$('quickCategory').value;let filtered=all.filter(i=>(cat==='all'||favorites[i].category===cat)&&[DATA[i].cite,DATA[i].title,DATA[i].group,favorites[i].note].join(' ').toLowerCase().includes(q));$('quickList').innerHTML=filtered.length?filtered.map(i=>{let x=DATA[i],v=favorites[i];return `<div class="item"><div class="quick-row"><input class="quick-check" type="checkbox" data-select="${i}" aria-label="Select ${escapeHTML(x.cite)}" ${selected.has(i)?'checked':''}><div class="quick-main"><strong>${escapeHTML(x.cite)} — ${escapeHTML(x.title)}</strong><p class="quick-meta">${escapeHTML(x.code==='2023'?'2023 Electric / Solar Ready':'2024 Low Energy / Carbon')} · ${escapeHTML(x.group)}</p><details><summary>View locked correction</summary><p>${escapeHTML(x.correction)}</p><p class="notice">${escapeHTML(x.status||'Draft; verify before enforcement')}</p></details><div class="quick-note"><label for="note-${i}">Additional inspector notes (optional)</label><textarea class="note-field" id="note-${i}" data-note="${i}" maxlength="3000" placeholder="Site-specific observations, location, equipment ID, or other details...">${escapeHTML(v.note)}</textarea><p class="notice">Your notes are separate from the locked code text.</p></div><div class="quick-controls"><label for="category-${i}">Category</label><input id="category-${i}" data-category="${i}" value="${escapeHTML(v.category)}" maxlength="80" aria-label="Category for ${escapeHTML(x.cite)}"></div><div class="quick-actions"><button data-quick="copy" data-id="${i}">Copy correction + notes</button><button data-quick="add" data-id="${i}">Add to POSSE</button><button data-quick="email" data-id="${i}">${collection.includes(i)?"✓ Added to Email":"Add to Email"}</button><button class="alt" data-quick="remove" data-id="${i}">Remove favorite</button></div></div></div></div>`}).join(''):'<p class="notice">No saved corrections match this filter. Open a code library and choose ☆ Save to Quick.</p>'}
 $('hvacCopy').onclick=e=>copyText(formatted(HVAC_CORRECTION,'correction'),e.target);$('hvacPosse').onclick=e=>{if(!posseCollection.includes(HVAC_ID))posseCollection.push(HVAC_ID);refreshCounts();e.target.textContent='✓ Added to POSSE';notify('✓ Added to POSSE Collection')};
 $('quickSearch').oninput=draw;$('quickCategory').onchange=draw;
 $('newCategory').onclick=()=>{let name=prompt('New category name (assign it to a saved correction below):');if(!name||!name.trim())return;name=name.trim().slice(0,80);let opt=document.createElement('option');opt.value=name;opt.textContent=name;$('quickCategory').appendChild(opt);notify('Category ready. Assign it to a saved correction to keep it.')};
 $('quickList').onchange=e=>{let t=e.target;if(t.matches('[data-select]')){let i=Number(t.dataset.select);t.checked?selected.add(i):selected.delete(i)}else if(t.matches('[data-category]')){let i=Number(t.dataset.category);favorites[i].category=t.value.trim().slice(0,80)||DATA[i].group;saveFavorites();notify('Category saved')}};
 $('quickList').oninput=e=>{let t=e.target;if(t.matches('[data-note]')){let i=Number(t.dataset.note);favorites[i].note=t.value.slice(0,3000);saveFavorites()}};
 $('quickList').onclick=e=>{let b=e.target.closest('[data-quick]');if(!b)return;let i=Number(b.dataset.id);if(b.dataset.quick==='remove'){delete favorites[i];selected.delete(i);saveFavorites();quickCorrections();notify('Favorite removed')}else if(b.dataset.quick==='copy')copyText(quickFormatted(i),b);else if(b.dataset.quick==='email'){if(!collection.includes(i))collection.push(i);refreshCounts();b.textContent='✓ Added to Email';notify('✓ Added to Email Collection')}else{if(!posseCollection.includes(i))posseCollection.push(i);refreshCounts();notify('✓ Added to POSSE Collection')}};
 $('quickCopySelected').onclick=e=>{let ids=[...selected].filter(i=>favorites[i]);if(!ids.length){notify('Select at least one correction');return}copyText(ids.map(quickFormatted).join('\n\n--------------------\n\n'),e.target)};
 $('quickAddSelected').onclick=()=>{let ids=[...selected].filter(i=>favorites[i]);if(!ids.length){notify('Select at least one correction');return}ids.forEach(i=>{if(!posseCollection.includes(i))posseCollection.push(i)});refreshCounts();notify('✓ '+ids.length+' selected correction(s) added to POSSE')};
 $('quickAddEmailSelected').onclick=()=>{let ids=[...selected].filter(i=>favorites[i]);if(!ids.length){notify('Select at least one correction');return}ids.forEach(i=>{if(!collection.includes(i))collection.push(i)});refreshCounts();draw();notify('✓ '+ids.length+' selected reference(s) added to Email Collection')};
 $('quickExport').onclick=quickExport;$('quickImport').onchange=e=>quickImport(e.target.files[0]);draw()}
updateFavCount();

function email(){renderCollection('email')}
$('quickHome').onclick=quickCorrections;
$('posseDock').onclick=()=>renderCollection('posse');$('emailDock').onclick=email;
function placeholder(title){showShell(title);detail.innerHTML=`<h2>${escapeHTML(title)}</h2><p class="notice">This category is reserved for verified code references. Electrical provisions currently available are in the two main code libraries.</p><button class="back" id="browseCodes">Browse electrical code library</button>`;$('browseCodes').onclick=()=>library('2023')}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let id=b.dataset.go;if(id==='model')library('2023');else if(id==='energy')library('2024');else if(id==='email')emailPicker();else if(id==='topics')topics();else definitions()});
$('searchForm').onsubmit=e=>{e.preventDefault();library('2023',$('searchInput').value);$('codeFilter').value='all';renderResults()};$('backBtn').onclick=goHome;$('homeBtn').onclick=goHome;$('stickyHome').onclick=goHome;$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'☀ Light mode':'☾ Dark mode'};$('menu').onclick=()=>current==='home'?topics():goHome();
</script></body></html>
